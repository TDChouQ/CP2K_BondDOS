name: test-and-build

# Tests on Linux / Windows / macOS; builds the GUI-less Linux binary and the Windows GUI exe.
# Pushing a tag "v*" attaches both files to the GitHub release of that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-cli.txt pytest scipy
      - run: python -m pytest tests -q

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            spec: CP2K_BondDOS_cli.spec
            reqs: requirements-cli.txt
            artifact: dist/cp2k-bonddos
            name: cp2k-bonddos-linux-x86_64
          - os: windows-latest
            spec: CP2K_BondDOS.spec
            reqs: requirements.txt
            artifact: dist/CP2K_BondDOS.exe
            name: CP2K_BondDOS-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ${{ matrix.reqs }} pyinstaller
      - run: python -m PyInstaller --noconfirm --clean ${{ matrix.spec }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
